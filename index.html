<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrei Bogdan</title>
  <meta name="description" content="Creative studio. Identity, campaigns, and visual production for modern brands." />
  <link rel="preload" href="fonts/Switzer-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/Switzer-Black.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="portrait-cutout.webp" as="image" type="image/webp" />
  <link rel="stylesheet" href="style.css?v=8" />
  <script>document.write('<script src="content/manifest.js?' + Date.now() + '"><\/script>');</script>
</head>
<body class="home">
  <header>
    <a href="index.html" class="logo">AndreiBogdan</a>
    <nav class="nav-links">
      <a href="branding.html">BRANDING</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-glow"></div>

    <div class="hero-person p-body">
      <img src="portrait-cutout.webp" width="1122" height="1222" alt="Andrei Bogdan" fetchpriority="high" decoding="async" />
    </div>

    <h1 class="hero-name" aria-label="Andrei Bogdan">
      <span class="w w1" aria-hidden="true"><span style="--i:0">A</span><span style="--i:1">N</span><span style="--i:2">D</span><span style="--i:3">R</span><span style="--i:4">E</span><span style="--i:5">I</span></span>
      <span class="w w2" aria-hidden="true"><span style="--i:0">B</span><span style="--i:1">O</span><span style="--i:2">G</span><span style="--i:3">D</span><span style="--i:4">A</span><span style="--i:5">N</span></span>
    </h1>

    <div class="hero-person p-head" aria-hidden="true">
      <img src="portrait-cutout.webp" width="1122" height="1222" alt="" decoding="async" />
    </div>

    <div class="hero-blur b1"></div>
    <div class="hero-blur b2"></div>
    <div class="hero-blur b3"></div>
    <div class="hero-grain"></div>
  </section>

  <section class="portfolio" id="portfolio"></section>

  <script>
    const VIDEO_EXT = /\.(mp4|webm|mov)$/i;

    const grid = document.getElementById('portfolio');

    // Videos only download their data and play while near the viewport.
    // Poster + dimensions come from update-content.command (content/posters, PORTFOLIO_META).
    const videoObserver = 'IntersectionObserver' in window
      ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            const v = entry.target;
            if (entry.isIntersecting) {
              v.preload = 'auto';
              const p = v.play();
              if (p && p.catch) p.catch(() => {});
            } else {
              v.pause();
            }
          });
        }, { rootMargin: '300px 0px' })
      : null;

    (window.PORTFOLIO_FILES || []).forEach(name => {
          const item = document.createElement('div');
          item.className = 'portfolio-item';

          if (VIDEO_EXT.test(name)) {
            const v = document.createElement('video');
            v.loop = true; v.muted = true; v.playsInline = true;
            const meta = (window.PORTFOLIO_META || {})[name];
            if (meta) {
              // Dimensions and poster are known up front: reserve the space, download nothing until near the viewport.
              v.width = meta.w; v.height = meta.h;
              v.poster = 'content/posters/' + name.replace(/\.[^.]+$/, '') + '.jpg';
              v.preload = 'none';
              item.classList.add(meta.w > meta.h ? 'full-row' : 'portrait');
            } else {
              v.preload = 'metadata';
              v.addEventListener('loadedmetadata', () => {
                if (v.videoWidth > v.videoHeight) item.classList.add('full-row');
                else item.classList.add('portrait');
              });
            }
            v.src = 'content/' + name;
            item.appendChild(v);
            if (videoObserver) videoObserver.observe(v);
            else v.autoplay = true;
          } else {
            const img = document.createElement('img');
            img.alt = name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
            img.decoding = 'async';
            const meta = (window.PORTFOLIO_META || {})[name];
            if (meta) {
              img.width = meta.w; img.height = meta.h;
              img.loading = 'lazy';
              item.classList.add(meta.w > meta.h ? 'full-row' : 'portrait');
            } else {
              img.addEventListener('load', () => {
                if (img.naturalWidth > img.naturalHeight) item.classList.add('full-row');
                else item.classList.add('portrait');
              });
            }
            img.src = 'content/' + name;
            item.appendChild(img);
          }
          grid.appendChild(item);
        });
  </script>
</body>
</html>
