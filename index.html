<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrei Bogdan</title>
  <link rel="stylesheet" href="style.css" />
  <script src="content/manifest.js"></script>
</head>
<body>
  <header>
    <span class="nav-left">©2026</span>
    <a href="contact.html" class="nav-right">CONTACT</a>
  </header>

  <main>
    <h1><span class="name-first">Andrei</span><br class="name-break"><span class="name-last">Bogdan</span></h1>
    <p class="tagline">AI Artist & Creative Director crafting cinematic campaigns for modern brands</p>
  </main>

  <section class="portfolio" id="portfolio"></section>

  <script>
    const VIDEO_EXT = /\.(mp4|webm|mov)$/i;

    const grid = document.getElementById('portfolio');
    (window.PORTFOLIO_FILES || []).forEach(name => {
          const item = document.createElement('div');
          item.className = 'portfolio-item';

          if (VIDEO_EXT.test(name)) {
            const v = document.createElement('video');
            v.src = 'content/' + name;
            v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
            v.addEventListener('loadedmetadata', () => {
              if (v.videoWidth > v.videoHeight) item.classList.add('full-row');
              else item.classList.add('portrait');
            });
            item.appendChild(v);
          } else {
            const img = document.createElement('img');
            img.src = 'content/' + name;
            img.alt = name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
            img.addEventListener('load', () => {
              if (img.naturalWidth > img.naturalHeight) item.classList.add('full-row');
              else item.classList.add('portrait');
            });
            item.appendChild(img);
          }
          grid.appendChild(item);
        });
  </script>
</body>
</html>
